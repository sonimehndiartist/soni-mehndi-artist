<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soni Mehndi Artist | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #2C4A3E;
      --deep-forest: #1A3027;
      --warm-gold: #D4AF37;
      --soft-gold: #F3E5AB;
      --cream: #FAF6EE;
      --dark-text: #222222;
      --light-text: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--cream);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(44, 74, 62, 0.08) 0%, transparent 20%);
    }

    .container {
      max-width: 700px;
      width: 100%;
      margin: auto;
    }

    .mandala-icon {
      width: 70px;
      height: 70px;
      margin-bottom: 1rem;
      fill: var(--warm-gold);
    }

    .brand-name {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--primary-green);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    /* Large Custom Heading */
    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      color: var(--deep-forest);
      text-transform: uppercase;
      letter-spacing: 6px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-shadow: 1px 1px 2px rgba(212, 175, 55, 0.3);
    }

    .sub-title {
      font-size: 1.5rem;
      color: var(--warm-gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 1.5rem;
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--light-text);
      line-height: 1.6;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--light-text);
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .main-title { font-size: 2.4rem; letter-spacing: 3px; }
      .sub-title { font-size: 1.1rem; letter-spacing: 2px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Decorative Mandala Icon -->
    <svg class="mandala-icon" viewBox="0 0 24 24">
      <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z"/>
    </svg>

    <p class="brand-name">Organic & Handcrafted</p>
    
    <!-- Large Heading -->
    <h1 class="main-title">Soni</h1>
    <div class="sub-title">Mehndi Artist</div>

    <p class="tagline">We are crafting premium, 100% natural organic mehndi cones, essential oils, and henna kits for your special occasions. Coming soon!</p>
  </div>

  <footer>
    <p>&copy; 2026 Soni Mehndi Artist. All rights reserved.</p>
  </footer>

</body>
</html>
